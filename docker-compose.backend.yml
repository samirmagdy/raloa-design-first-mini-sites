services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: raloa
      POSTGRES_PASSWORD: raloa
      POSTGRES_DB: raloa
    ports: ["5432:5432"]
    volumes: ["raloa-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raloa -d raloa"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  raloa-postgres:
