services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: raloa
      POSTGRES_PASSWORD: raloa
      POSTGRES_DB: raloa
    # PostgreSQL 18 stores its cluster below /var/lib/postgresql/<major>/docker.
    # Bind the parent directory so the image can manage versioned data safely.
    ports: ["5433:5432"]
    volumes: ["raloa-postgres-v18:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raloa -d raloa"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  raloa-postgres-v18:
